<p>Produto: {{ nomeProduto }}</p>
<p>Quantidade em estoque: {{ quantidadeEstoque }}</p>

<p *ngIf="quantidadeEstoque > 0">Produto disponível</p>
<p *ngIf="quantidadeEstoque === 0">Produto sem estoque</p>

<button (click)="adicionarItemEstoque()">Adicionar unidade</button>
<button
  (click)="removerItemEstoque()"
  [disabled]="quantidadeEstoque === 0"
>
  Remover unidade
</button>
