<p>Produto: {{ nomeProduto }}</p>
<p>Quantidade em estoque: {{ quantidadeEstoque }}</p>

@if (quantidadeEstoque > 0) {
  <p>Produto disponível</p>
} @else {
  <p>Produto sem estoque</p>
}

<button (click)="adicionarItemEstoque()">Adicionar unidade</button>
<button (click)="removerItemEstoque()" [disabled]="quantidadeEstoque === 0">Remover unidade</button>
