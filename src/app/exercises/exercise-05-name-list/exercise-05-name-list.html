<ul>
  @for (
    nome of nomes;
    track $index;
    let indice = $index;
    let primeiro = $first;
    let ultimo = $last
  ) {
    <li>
      {{ indice + 1 }} - {{ nome }}
      @if (primeiro) {
        <span>Primeiro da lista</span>
      }
      @if (ultimo) {
        <span>Último da lista</span>
      }
    </li>
  }
</ul>
