<ul>
  <li
    *ngFor="
      let disciplina of disciplinas;
      let par = even;
      let impar = odd;
      let primeira = first;
      let ultima = last
    "
    [ngClass]="{
      'posicao-par': par,
      'posicao-impar': impar,
      'primeira-disciplina': primeira,
      'ultima-disciplina': ultima
    }"
  >
    {{ disciplina }}
  </li>
</ul>
