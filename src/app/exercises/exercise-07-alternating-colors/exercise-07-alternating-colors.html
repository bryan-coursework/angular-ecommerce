<ul>
  @for (
    disciplina of disciplinas;
    track disciplina;
    let par = $even;
    let impar = $odd;
    let primeira = $first;
    let ultima = $last
  ) {
    <li
      [ngClass]="{
        'posicao-par': par,
        'posicao-impar': impar,
        'primeira-disciplina': primeira,
        'ultima-disciplina': ultima,
      }"
    >
      {{ disciplina }}
    </li>
  }
</ul>
