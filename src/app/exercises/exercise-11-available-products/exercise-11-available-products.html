<button (click)="exibirTodos()">Exibir todos os produtos</button>
<button (click)="exibirSomenteDisponiveis()">Exibir somente produtos disponíveis</button>

<ul>
  @for (produto of produtos; track produto.id) {
    @if (!somenteDisponiveis || produto.quantidade > 0) {
      <li>
        {{ produto.nome }} - {{ produto.preco | currency: 'BRL' }} - Quantidade:
        {{ produto.quantidade }}
      </li>
    }
  }
</ul>
