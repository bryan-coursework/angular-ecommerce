<label for="nome-produto">Nome do produto</label>
<input id="nome-produto" type="text" [(ngModel)]="novoNome" />

<label for="quantidade-produto">Quantidade</label>
<input id="quantidade-produto" type="number" min="0" [(ngModel)]="novaQuantidade" />

<button (click)="cadastrarProduto()">Cadastrar</button>

@if (mensagemErro) {
  <p>{{ mensagemErro }}</p>
}

<ul>
  @for (produto of produtos; track produto.id) {
    <li>
      {{ produto.nome }} - Quantidade: {{ produto.quantidade }}
      <button (click)="excluirProduto(produto.id)">Excluir</button>
    </li>
  }
</ul>
